<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortMorning</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #7cfc00; /* Grass green */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent zooming/scrolling on mobile */
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .health-container {
            width: 250px;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 3px solid #333;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #00ff00);
            transition: width 0.2s ease;
        }
        
        #health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .score-container {
            font-size: 28px;
            font-weight: bold;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #333;
            text-shadow: 2px 2px 0px #000;
        }

        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            color: white;
            z-index: 10;
        }

        #game-over h1 {
            font-size: 64px;
            margin-bottom: 10px;
            color: #ff3333;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #000;
        }

        #final-score {
            font-size: 32px;
            margin-bottom: 40px;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0056b3;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            background-color: #0088ff;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #0056b3;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="health-container">
                <div id="health-bar"></div>
                <div id="health-text">100 / 100</div>
            </div>
            <div class="score-container">
                Score: <span id="score">0</span>
            </div>
            <div class="wood-container" style="font-size: 28px; font-weight: bold; color: white; background-color: rgba(0, 0, 0, 0.5); padding: 10px 20px; border-radius: 15px; border: 3px solid #333; text-shadow: 2px 2px 0px #000; margin-left: 10px;">
                Wood: <span id="wood">0</span>
            </div>
        </div>
        <div class="instructions">
            <b>Controls:</b><br>
            WASD / Arrows: Move<br>
            Space: Jump (Land on enemies to eliminate!)<br>
            Left Click: Swing Pickaxe (Break builds, traps & chests)<br>
            Right Click / E: Build Wall (Costs 1 Wood)
        </div>
    </div>

    <div id="game-over">
        <h1>Eliminated</h1>
        <div id="final-score">Score: 0</div>
        <button onclick="resetGame()">Play Again</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const healthBar = document.getElementById('health-bar');
    const healthText = document.getElementById('health-text');
    const scoreElement = document.getElementById('score');
    const woodElement = document.getElementById('wood');
    const gameOverScreen = document.getElementById('game-over');
    const finalScoreElement = document.getElementById('final-score');

    let width, height;
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let gameState = 'playing'; // playing, gameover
    let score = 0;
    let wood = 0;
    let frameCount = 0;

    // Input Handling
    const keys = { w: false, a: false, s: false, d: false, ' ': false };
    const mouse = { x: 0, y: 0, clicked: false };

    window.addEventListener('keydown', e => {
        let key = e.key.toLowerCase();
        if (key === 'arrowup') key = 'w';
        if (key === 'arrowdown') key = 's';
        if (key === 'arrowleft') key = 'a';
        if (key === 'arrowright') key = 'd';
        if (key === 'e') player.buildWall();
        if (keys.hasOwnProperty(key)) keys[key] = true;
    });

    window.addEventListener('keyup', e => {
        let key = e.key.toLowerCase();
        if (key === 'arrowup') key = 'w';
        if (key === 'arrowdown') key = 's';
        if (key === 'arrowleft') key = 'a';
        if (key === 'arrowright') key = 'd';
        if (keys.hasOwnProperty(key)) keys[key] = false;
    });

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', e => {
        if (e.button === 0 && gameState === 'playing') {
            player.attack();
        } else if (e.button === 2 && gameState === 'playing') {
            player.buildWall();
        }
    });

    window.addEventListener('contextmenu', e => {
        e.preventDefault(); // Prevent right-click menu
    });

    // Helper Math Functions
    function dist(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
    }
    function circleRectCollide(circle, rect) {
        let distX = Math.abs(circle.x - rect.x - rect.w / 2);
        let distY = Math.abs(circle.y - rect.y - rect.h / 2);

        if (distX > (rect.w / 2 + circle.r)) return false;
        if (distY > (rect.h / 2 + circle.r)) return false;

        if (distX <= (rect.w / 2)) return true;
        if (distY <= (rect.h / 2)) return true;

        let dx = distX - rect.w / 2;
        let dy = distY - rect.h / 2;
        return (dx * dx + dy * dy <= (circle.r * circle.r));
    }

    // Entities Arrays
    let enemies = [];
    let builds = [];
    let traps = [];
    let particles = [];
    let chests = [];
    let items = [];

    // Player Object
    const player = {
        x: width / 2,
        y: height / 2,
        r: 20,
        speed: 5,
        hp: 100,
        maxHp: 100,
        color: '#00aaff',
        
        // Jump mechanics
        isJumping: false,
        jumpTimer: 0,
        jumpDuration: 40,
        jumpZ: 0, // Visual height

        // Attack mechanics
        isAttacking: false,
        attackTimer: 0,
        attackDuration: 15,
        attackAngle: 0,
        
        // Damage mechanics
        invulnerableTimer: 0,

        update() {
            if (this.hp <= 0) return;

            // Invulnerability timer
            if (this.invulnerableTimer > 0) this.invulnerableTimer--;

            // Jumping Logic
            if (keys[' '] && !this.isJumping) {
                this.isJumping = true;
                this.jumpTimer = 0;
            }

            if (this.isJumping) {
                this.jumpTimer++;
                // Parabolic jump arc using sine wave
                this.jumpZ = Math.sin((this.jumpTimer / this.jumpDuration) * Math.PI) * 30;
                
                if (this.jumpTimer >= this.jumpDuration) {
                    this.isJumping = false;
                    this.jumpZ = 0;
                    this.checkJumpLanding();
                }
            }

            // Attack Logic
            if (this.isAttacking) {
                this.attackTimer++;
                if (this.attackTimer >= this.attackDuration) {
                    this.isAttacking = false;
                }
            }

            // Movement logic (store old pos for collision resolution)
            let oldX = this.x;
            let oldY = this.y;
            let dx = 0;
            let dy = 0;

            if (keys.w) dy -= this.speed;
            if (keys.s) dy += this.speed;
            if (keys.a) dx -= this.speed;
            if (keys.d) dx += this.speed;

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                let length = Math.hypot(dx, dy);
                dx = (dx / length) * this.speed;
                dy = (dy / length) * this.speed;
            }

            this.x += dx;
            this.y += dy;

            // Screen boundaries
            this.x = Math.max(this.r, Math.min(width - this.r, this.x));
            this.y = Math.max(this.r, Math.min(height - this.r, this.y));

            // Collision with builds
            for (let b of builds) {
                if (circleRectCollide({x: this.x, y: this.y, r: this.r}, b)) {
                    // Resolve collision - simply push back for now
                    this.x = oldX;
                    this.y = oldY;
                }
            }

            // Check Traps
            if (!this.isJumping && this.invulnerableTimer <= 0) {
                for (let t of traps) {
                    if (circleRectCollide({x: this.x, y: this.y, r: this.r}, t)) {
                        this.takeDamage(10);
                        this.invulnerableTimer = 30; // iframe
                    }
                }
            }

            // Check Items
            for (let i = items.length - 1; i >= 0; i--) {
                if (dist(this.x, this.y, items[i].x, items[i].y) < this.r + 15) {
                    if (items[i].type === 'wood') {
                        wood += items[i].amount;
                        updateWood();
                    } else if (items[i].type === 'health') {
                        this.hp = Math.min(this.maxHp, this.hp + items[i].amount);
                        updateHealth();
                    }
                    createParticles(items[i].x, items[i].y, items[i].type === 'wood' ? '#d2b48c' : '#00ff00');
                    items.splice(i, 1);
                }
            }
        },

        buildWall() {
            if (wood >= 1) {
                wood--;
                updateWood();
                
                let w = 40;
                let h = 40;
                let bx = mouse.x - w/2;
                let by = mouse.y - h/2;
                
                builds.push({x: bx, y: by, w: w, h: h, color: '#8b4513', playerBuilt: true});
                createParticles(mouse.x, mouse.y, '#8b4513');
            }
        },

        attack() {
            if (this.isAttacking) return;
            this.isAttacking = true;
            this.attackTimer = 0;
            this.attackAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

            const attackRadius = 80;

            // Hit detection for enemies (180-degree sweep)
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let d = dist(this.x, this.y, e.x, e.y);
                if (d < attackRadius + e.r) {
                    let angleTo = Math.atan2(e.y - this.y, e.x - this.x);
                    let angleDiff = Math.abs(angleTo - this.attackAngle);
                    if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                    
                    if (angleDiff <= Math.PI / 2) { // 180 degrees sweep (90 on each side)
                        createParticles(e.x, e.y, e.color);
                        enemies.splice(i, 1);
                        score += 50;
                        updateScore();
                    }
                }
            }

            // Hit detection for objects (builds, traps, chests)
            const hitPoint = {
                x: this.x + Math.cos(this.attackAngle) * 40,
                y: this.y + Math.sin(this.attackAngle) * 40,
                r: 50 // wide radius to simulate sweep for objects
            };

            // Check builds
            for (let i = builds.length - 1; i >= 0; i--) {
                if (circleRectCollide(hitPoint, builds[i])) {
                    createParticles(builds[i].x + builds[i].w/2, builds[i].y + builds[i].h/2, '#8b4513');
                    if (!builds[i].playerBuilt) {
                        // Natural builds drop wood occasionally
                        items.push({x: builds[i].x + builds[i].w/2, y: builds[i].y + builds[i].h/2, type: 'wood', amount: 1});
                    }
                    builds.splice(i, 1);
                    score += 10;
                    updateScore();
                }
            }

            // Check traps
            for (let i = traps.length - 1; i >= 0; i--) {
                if (circleRectCollide(hitPoint, traps[i])) {
                    createParticles(traps[i].x + traps[i].w/2, traps[i].y + traps[i].h/2, '#ff3333');
                    traps.splice(i, 1);
                    score += 5;
                    updateScore();
                }
            }

            // Check chests
            for (let i = chests.length - 1; i >= 0; i--) {
                if (circleRectCollide(hitPoint, chests[i])) {
                    createParticles(chests[i].x + chests[i].w/2, chests[i].y + chests[i].h/2, '#ffd700');
                    
                    // Drop loot
                    let numLoot = 1 + Math.floor(Math.random() * 3);
                    for(let j=0; j<numLoot; j++) {
                        let type = Math.random() > 0.3 ? 'wood' : 'health';
                        let amount = type === 'wood' ? (1 + Math.floor(Math.random() * 3)) : 20;
                        items.push({
                            x: chests[i].x + chests[i].w/2 + (Math.random() * 40 - 20), 
                            y: chests[i].y + chests[i].h/2 + (Math.random() * 40 - 20), 
                            type: type, 
                            amount: amount
                        });
                    }
                    
                    chests.splice(i, 1);
                    score += 25;
                    updateScore();
                }
            }
        },

        checkJumpLanding() {
            // Check if landed on enemy
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (dist(this.x, this.y, e.x, e.y) < this.r + e.r) {
                    // Eliminated!
                    createParticles(e.x, e.y, e.color);
                    enemies.splice(i, 1);
                    score += 50;
                    updateScore();
                    // Bounce
                    this.isJumping = true;
                    this.jumpTimer = 0;
                }
            }
        },

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp <= 0) {
                this.hp = 0;
                endGame();
            }
            updateHealth();
        },

        draw() {
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, this.r, this.r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Player body
            ctx.save();
            ctx.translate(this.x, this.y - this.jumpZ);
            
            // Blink if invulnerable
            if (this.invulnerableTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Draw Pickaxe swing
            if (this.isAttacking) {
                ctx.save();
                ctx.rotate(this.attackAngle);
                
                // Swing animation calc
                let progress = this.attackTimer / this.attackDuration;
                let swingAngle = (progress * Math.PI) - (Math.PI / 2); // 180 deg sweep: -90 to 90 deg
                
                ctx.rotate(swingAngle);
                
                // Draw Pickaxe
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#5c4033'; // Handle
                ctx.beginPath();
                ctx.moveTo(this.r, 0);
                ctx.lineTo(this.r + 40, 0);
                ctx.stroke();

                ctx.fillStyle = '#b0c4de'; // Blade
                ctx.beginPath();
                ctx.arc(this.r + 40, 0, 15, -Math.PI/4, Math.PI/4);
                ctx.lineTo(this.r + 30, 0);
                ctx.fill();
                ctx.restore();
            }

            // Draw player circle
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            
            let pGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.r);
            pGrad.addColorStop(0, '#33ccff');
            pGrad.addColorStop(1, '#006699');
            
            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.arc(0, 0, this.r + (this.jumpZ * 0.2), 0, Math.PI * 2); // Slightly scale up when jumping
            ctx.fill();
            
            ctx.shadowBlur = 0; // Reset shadow
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#00334d';
            ctx.stroke();

            // Eyes (facing mouse)
            let angleToMouse = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            let eyeOffsetX = Math.cos(angleToMouse) * 8;
            let eyeOffsetY = Math.sin(angleToMouse) * 8;
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(eyeOffsetX - 5, eyeOffsetY - 5, 4, 0, Math.PI*2);
            ctx.arc(eyeOffsetX + 5, eyeOffsetY - 5, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(eyeOffsetX - 5, eyeOffsetY - 5, 2, 0, Math.PI*2);
            ctx.arc(eyeOffsetX + 5, eyeOffsetY - 5, 2, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }
    };

    class Enemy {
        constructor() {
            // Spawn outside center
            let margin = 50;
            if (Math.random() > 0.5) {
                this.x = Math.random() > 0.5 ? margin : width - margin;
                this.y = Math.random() * height;
            } else {
                this.x = Math.random() * width;
                this.y = Math.random() > 0.5 ? margin : height - margin;
            }
            this.r = 18;
            this.speed = 1.5 + Math.random() * 1.5;
            this.color = '#800080';
            this.angle = Math.random() * Math.PI * 2;
            this.changeDirTimer = 0;
        }

        update() {
            // Wander AI
            this.changeDirTimer--;
            if (this.changeDirTimer <= 0) {
                this.angle = Math.random() * Math.PI * 2;
                this.changeDirTimer = 60 + Math.random() * 60;
            }

            // Move towards player if close
            let dToPlayer = dist(this.x, this.y, player.x, player.y);
            if (dToPlayer < 300) {
                this.angle = Math.atan2(player.y - this.y, player.x - this.x);
            }

            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;

            // Boundaries
            this.x = Math.max(this.r, Math.min(width - this.r, this.x));
            this.y = Math.max(this.r, Math.min(height - this.r, this.y));

            // Collision with player
            if (!player.isJumping && player.invulnerableTimer <= 0 && dToPlayer < this.r + player.r) {
                player.takeDamage(15);
                player.invulnerableTimer = 30;
                // Bounce back
                this.x -= Math.cos(this.angle) * 20;
                this.y -= Math.sin(this.angle) * 20;
            }
        }

        draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y + 5, this.r, this.r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';

            let eGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
            eGrad.addColorStop(0, '#ff66ff');
            eGrad.addColorStop(1, '#800080');

            ctx.fillStyle = eGrad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#4b0082';
            ctx.stroke();

            // Angry eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.x - 5, this.y - 3, 4, 0, Math.PI*2);
            ctx.arc(this.x + 5, this.y - 3, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.x - 9, this.y - 7);
            ctx.lineTo(this.x - 2, this.y - 4);
            ctx.moveTo(this.x + 9, this.y - 7);
            ctx.lineTo(this.x + 2, this.y - 4);
            ctx.stroke();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 6 + 2;
            this.speedX = (Math.random() - 0.5) * 8;
            this.speedY = (Math.random() - 0.5) * 8;
            this.life = 1;
            this.decay = Math.random() * 0.05 + 0.02;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    function createParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    // Spawners
    function spawnChest() {
        if (chests.length > 5) return;
        let w = 35;
        let h = 25;
        let x = Math.random() * (width - w);
        let y = Math.random() * (height - h);
        if (dist(x+w/2, y+h/2, player.x, player.y) > 200) {
            chests.push({x, y, w, h, color: '#daa520'});
        }
    }

    function spawnBuild() {
        if (builds.length > 15) return;
        let w = 40 + Math.random() * 40;
        let h = 40 + Math.random() * 40;
        let x = Math.random() * (width - w);
        let y = Math.random() * (height - h);
        
        // Don't spawn on player
        if (dist(x+w/2, y+h/2, player.x, player.y) > 100) {
            builds.push({x, y, w, h, color: '#8b4513'});
        }
    }

    function spawnTrap() {
        if (traps.length > 10) return;
        let w = 30;
        let h = 30;
        let x = Math.random() * (width - w);
        let y = Math.random() * (height - h);
        if (dist(x+w/2, y+h/2, player.x, player.y) > 150) {
            traps.push({x, y, w, h, color: '#ff3333'});
        }
    }

    function spawnEnemy() {
        if (enemies.length < 5 + (score / 100)) {
            enemies.push(new Enemy());
        }
    }

    function drawBuilds() {
        for (let b of builds) {
            // Shadow
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.6)";

            // Gradient for box
            let grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
            grad.addColorStop(0, b.color);
            grad.addColorStop(1, '#5c2e0b');

            ctx.fillStyle = grad;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            
            ctx.shadowBlur = 0;

            // Planks detail
            ctx.strokeStyle = '#3e1f06';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.beginPath();
            ctx.moveTo(b.x, b.y + b.h/3);
            ctx.lineTo(b.x + b.w, b.y + b.h/3);
            ctx.moveTo(b.x, b.y + (b.h/3)*2);
            ctx.lineTo(b.x + b.w, b.y + (b.h/3)*2);
            ctx.stroke();
        }
    }

    function drawTraps() {
        for (let t of traps) {
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.fillStyle = '#222';
            ctx.fillRect(t.x, t.y, t.w, t.h);
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = t.color;
            ctx.beginPath();
            // Spikes
            for(let i=0; i<3; i++) {
                ctx.moveTo(t.x + (i * 10), t.y + t.h);
                ctx.lineTo(t.x + 5 + (i * 10), t.y);
                ctx.lineTo(t.x + 10 + (i * 10), t.y + t.h);
            }
            ctx.fill();
        }
    }

    function drawChests() {
        for (let c of chests) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            
            // Gradient for chest
            let grad = ctx.createLinearGradient(c.x, c.y, c.x, c.y + c.h);
            grad.addColorStop(0, '#ffd700'); // Gold top
            grad.addColorStop(1, '#b8860b'); // Dark gold bottom
            
            ctx.fillStyle = grad;
            ctx.fillRect(c.x, c.y, c.w, c.h);
            
            ctx.shadowBlur = 0;
            // Details
            ctx.strokeStyle = '#8b4513';
            ctx.lineWidth = 3;
            ctx.strokeRect(c.x, c.y, c.w, c.h);
            
            // Lock
            ctx.fillStyle = 'silver';
            ctx.fillRect(c.x + c.w/2 - 4, c.y + c.h/2 - 4, 8, 8);
        }
    }

    function drawItems() {
        for (let item of items) {
            ctx.shadowBlur = 8;
            ctx.shadowColor = item.type === 'wood' ? '#d2b48c' : '#00ff00';
            ctx.fillStyle = item.type === 'wood' ? '#8b4513' : '#ff3333';
            
            ctx.beginPath();
            if (item.type === 'wood') {
                // Draw a small log
                ctx.fillRect(item.x - 8, item.y - 4, 16, 8);
            } else {
                // Draw a health cross
                ctx.fillRect(item.x - 3, item.y - 8, 6, 16);
                ctx.fillRect(item.x - 8, item.y - 3, 16, 6);
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // UI Updates
    function updateWood() {
        woodElement.innerText = wood;
    }

    function updateHealth() {
        let pct = (player.hp / player.maxHp) * 100;
        healthBar.style.width = pct + '%';
        healthText.innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;
    }

    function updateScore() {
        scoreElement.innerText = score;
    }

    function endGame() {
        gameState = 'gameover';
        finalScoreElement.innerText = `Final Score: ${score}`;
        gameOverScreen.style.display = 'flex';
    }

    function resetGame() {
        player.hp = player.maxHp;
        player.x = width / 2;
        player.y = height / 2;
        score = 0;
        wood = 0;
        enemies = [];
        builds = [];
        traps = [];
        chests = [];
        items = [];
        particles = [];
        frameCount = 0;
        
        updateHealth();
        updateScore();
        updateWood();
        
        // Initial spawns
        for(let i=0; i<5; i++) spawnBuild();
        for(let i=0; i<3; i++) spawnTrap();
        for(let i=0; i<3; i++) spawnChest();

        gameState = 'playing';
        gameOverScreen.style.display = 'none';
    }

    // Main Game Loop
    function gameLoop() {
        if (gameState === 'playing') {
            // Clear canvas and draw realistic grass gradient
            let bgGrad = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, Math.max(width, height));
            bgGrad.addColorStop(0, '#55a832');
            bgGrad.addColorStop(1, '#37731e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Draw grid background for perspective
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            }
            for(let i=0; i<height; i+=50) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
            }

            // Logic
            player.update();
            enemies.forEach(e => e.update());

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Spawning
            frameCount++;
            if (frameCount % 60 === 0) spawnEnemy();
            if (frameCount % 120 === 0) spawnBuild();
            if (frameCount % 180 === 0) spawnTrap();
            if (frameCount % 400 === 0) spawnChest();

            // Drawing (Z-index ordering)
            drawTraps();
            drawBuilds();
            drawChests();
            drawItems();
            particles.forEach(p => p.draw());
            
            // Sort entities by Y for pseudo-3D depth rendering
            let renderList = [player, ...enemies].sort((a, b) => a.y - b.y);
            renderList.forEach(entity => entity.draw());

            // Passive score
            if (frameCount % 60 === 0) {
                score++;
                updateScore();
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // Start Game
    resetGame();
    gameLoop();

</script>
</body>
